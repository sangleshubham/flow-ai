# Merge gate (spec §18, CLAUDE.md): install, lint, typecheck, test, supply-chain audit.
# Never calls a live model: ILLUS_LLM_MODE=replay. Actions are pinned to commit SHAs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ILLUS_LLM_MODE: replay
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, test
        run: pnpm turbo run lint typecheck test
      - name: Synthetic EPUB is up to date
        run: |
          pnpm fixtures:epub
          git diff --exit-code -- fixtures/books/synthetic.epub
      - name: Contracts doc is up to date
        run: |
          pnpm contracts
          git diff --exit-code -- docs/contracts.md
      - name: Audit (fails on advisories not in the ADR 0004 baseline)
        run: pnpm audit --audit-level high
