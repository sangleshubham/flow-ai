packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"
  - "evals"

# Supply chain (spec §2, §17): never resolve a version published less than 14 days ago.
minimumReleaseAge: 20160

# Inherited Flow advisories (high/critical) accepted as a baseline on 2026-10-09 so that CI fails only on NEW
# ones (ADR 0004). None comes from an @illus package. Shrink this list as Flow dependencies are upgraded.
